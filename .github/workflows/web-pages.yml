name: Deploy Ritual website

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ritual-website
  cancel-in-progress: true

jobs:
  build:
    name: Prepare website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static website
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/script.js
          test -s web/privacy/index.html
          test -s web/support/index.html
          test -s web/CNAME
          test -s web/assets/i18n/en.json
          grep -Fxq "ritualapp.nishkamk.com" web/CNAME

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Publish website
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
