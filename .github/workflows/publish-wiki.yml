name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritual-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wiki source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Publish Markdown pages
        env:
          WIKI_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          git clone "$WIKI_REMOTE" wiki-repository || {
            mkdir wiki-repository
            git -C wiki-repository init
            git -C wiki-repository remote add origin "$WIKI_REMOTE"
          }
          cp wiki/*.md wiki-repository/
          git -C wiki-repository config user.name "github-actions[bot]"
          git -C wiki-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki-repository add --all
          if git -C wiki-repository diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git -C wiki-repository commit -m "Update Ritual wiki from ${GITHUB_SHA}"
          git -C wiki-repository push origin HEAD:master
