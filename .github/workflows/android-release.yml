name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritual-android-latest
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing. Follow the README section 'One-time signing setup'."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/ritual-release.jks"
          keytool -list -keystore "${RUNNER_TEMP}/ritual-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Determine build identity
        run: |
          APP_VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          BUILD_NUMBER="$((10000 + GITHUB_RUN_NUMBER))"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ritual-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Prepare downloadable files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ritual-latest.apk
          sha256sum ritual-latest.apk > ritual-latest.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ritual-apk-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-${{ env.SHORT_SHA }}
          path: |
            ritual-latest.apk
            ritual-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Automated Android build from main." \
            "" \
            "- App version: ${APP_VERSION}" \
            "- Android build number: ${BUILD_NUMBER}" \
            "- Commit: ${GITHUB_SHA}" \
            "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "Download ritual-latest.apk and open it on your Android phone." \
            > release-notes.md

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/ritual-latest" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/ritual-latest" \
              -f sha="${GITHUB_SHA}" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/ritual-latest" \
              -f sha="${GITHUB_SHA}" \
              >/dev/null
          fi

          if gh release view ritual-latest >/dev/null 2>&1; then
            gh release upload ritual-latest \
              ritual-latest.apk \
              ritual-latest.apk.sha256 \
              --clobber
            gh release edit ritual-latest \
              --title "Ritual Latest (${APP_VERSION}, build ${BUILD_NUMBER})" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create ritual-latest \
              ritual-latest.apk \
              ritual-latest.apk.sha256 \
              --verify-tag \
              --title "Ritual Latest (${APP_VERSION}, build ${BUILD_NUMBER})" \
              --notes-file release-notes.md \
              --prerelease
          fi
