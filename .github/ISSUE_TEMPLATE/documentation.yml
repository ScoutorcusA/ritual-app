name: Documentation improvement
description: Report missing, unclear, or incorrect public documentation.
title: "[Docs]: "
labels:
  - documentation
  - needs triage
body:
  - type: input
    id: location
    attributes:
      label: Document or page
      description: Link the README, wiki page, website page, or file involved.
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included real journal content, exports, credentials, or other private information.
          required: true
